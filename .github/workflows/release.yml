# Push a tag like v2.2.0 and this builds the download zip and publishes the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Releases come from main only, never from staging or a work branch
      - name: Check the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME isn't on main. Merge the pull request first, then tag main."
            exit 1
          fi

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi

      # Never release a build whose tests fail
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run the tests
        run: |
          npm ci
          npm test

      # Every release needs its own notes: the "## <version>" section of CHANGELOG.md
      - name: Take this version's notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 == "## " v {found=1; next} found && /^## / {exit} found' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "CHANGELOG.md has no '## $version' section. Add the release notes, then tag again."
            exit 1
          fi

      # Files sit at the zip's root, so "Extract all" gives one folder with manifest.json inside
      - name: Build the zip
        run: |
          (cd extension && zip -r -X ../focus-mode-for-youtube.zip .)
          sha256sum focus-mode-for-youtube.zip > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat changes.md
            echo
            echo "---"
            echo
            cat .github/release-notes.md
            echo
            echo "**SHA-256** of the zip: \`$(cut -d' ' -f1 SHA256SUMS.txt)\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" focus-mode-for-youtube.zip SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md
