# Push a tag like v2.2.0 and this builds the download zip and publishes the release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches manifest.json
        run: |
          version=$(jq -r .version extension/manifest.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match manifest version $version"
            exit 1
          fi

      # Files sit at the zip's root, so "Extract all" gives one folder with manifest.json inside
      - name: Build the zip
        run: |
          (cd extension && zip -r -X ../focus-mode-for-youtube.zip .)
          sha256sum focus-mode-for-youtube.zip > SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes.md
            echo
            echo "**SHA-256** of the zip: \`$(cut -d' ' -f1 SHA256SUMS.txt)\`"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" focus-mode-for-youtube.zip SHA256SUMS.txt \
            --title "Focus Mode for YouTube $GITHUB_REF_NAME" \
            --notes-file notes.md
