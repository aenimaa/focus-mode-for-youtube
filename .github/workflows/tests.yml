# Runs the tests on every push to main or staging, and on every pull request.
name: Tests

on:
  push:
    branches: [main, staging]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
